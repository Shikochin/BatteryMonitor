name: Android Build

# Builds one sideloadable APK per commit:
#   - release build type (R8 optimised), signed with the debug key
#   - arm64-v8a only
#   - versionCode = git commit count (see app/build.gradle.kts)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to a GitHub Release on tag pushes

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode is `git rev-list --count HEAD`; a shallow clone would
          # always report 1 and produce a stale version.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The `packages` input of setup-android fails the whole job when a package name does not
      # exist in the SDK repository. API 37 is published as `platforms;android-37.0` (the SDK now
      # uses a minor version in the package id), so install it explicitly and keep a fallback.
      - name: Install SDK platform
        run: |
          set -e
          install() { sdkmanager --install "$@" > /dev/null 2>&1; }
          install "platforms;android-37.0" "build-tools;37.0.0" \
            || install "platforms;android-37.1" "build-tools;37.0.0" \
            || install "platforms;android-37" "build-tools;37.0.0" \
            || { echo "::error::Cannot install the Android 37 platform"; sdkmanager --list_installed; exit 1; }
          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release build is signed with the debug key. AGP generates
      # ~/.android/debug.keystore when it is missing, so cache it to keep the
      # same signing key across runs — otherwise consecutive CI APKs could not
      # be installed over each other.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # The runner has no keystore; create the standard one (android /
      # androiddebugkey) so the release build is always signed, even on a cache
      # miss.
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Read version (commit count)
        id: version
        run: |
          chmod +x ./gradlew
          output=$(./gradlew -q :app:printVersion)
          code=$(printf '%s\n' "$output" | sed -n 's/^versionCode=//p' | head -1)
          name=$(printf '%s\n' "$output" | sed -n 's/^versionName=//p' | head -1)
          if [ -z "$code" ] || [ -z "$name" ]; then
            count=$(git rev-list --count HEAD)
            code=${code:-$count}
            name=${name:-1.0}
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### 版本 $name（build $code）"
            echo ""
            echo "- versionName: \`$name\`（固定）"
            echo "- versionCode: \`$code\`（commit 数）"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/BatteryMonitor-${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}-arm64-v8a.apk"
          ls -l dist

      - name: Verify version, signature and ABI
        run: |
          apk=$(ls dist/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | head -1
          printf '%s\n' "$badging" | grep -q "versionCode='${{ steps.version.outputs.code }}'" \
            || { echo "::error::APK versionCode does not match the commit count"; exit 1; }
          printf '%s\n' "$badging" | grep -q "native-code: 'arm64-v8a'" \
            || { echo "::error::APK is not arm64-v8a only"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug" \
            || { echo "::error::APK is not debug-signed"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryMonitor-${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk \
              --title "Battery Monitor ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})" \
              --notes "版本号取自 commit 数（versionCode ${{ steps.version.outputs.code }}），arm64-v8a，debug 签名。"
          fi
